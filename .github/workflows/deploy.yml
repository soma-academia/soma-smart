# Deploys the site to Cloudflare Pages (project "tech-tayari"). MANUAL ONLY for now: day-to-day publishing
# is ./deploy.sh on the owner's Mac. To use this, save a working CLOUDFLARE_API_TOKEN secret (Account →
# Cloudflare Pages → Edit, plus Account Settings → Read), then run it from the repo's Actions tab, or
# restore the `push: branches: [main]` trigger below to deploy on every push. See DEPLOY.md.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch: {}

# Never run two deploys at once; a newer push replaces a waiting one
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # content.js is generated from content/*.md; fail if someone edited the Markdown but forgot to rebuild
      - name: Check content.js is up to date
        run: |
          python3 _build.py
          [ -z "$(git status --porcelain -- content.js learn sitemap.xml robots.txt)" ] || { echo "::error::Generated lesson files are out of date. Run python3 _build.py and commit the results."; exit 1; }

      # Deploy only tracked files (never local-only files such as .dev.vars)
      - name: Prepare clean copy of the site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Tokens never contain whitespace, so strip any line break or space that came with the paste.
      # Clear messages for the common setup mistakes; the token itself is never printed.
      - name: Deploy
        working-directory: _site
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing."; exit 1; fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qi 'bearer\|curl'; then echo "::error::CLOUDFLARE_API_TOKEN looks like a command, not a token. Save only the token itself."; exit 1; fi
          if [ ${#CLOUDFLARE_API_TOKEN} -lt 30 ]; then echo "::error::CLOUDFLARE_API_TOKEN is only ${#CLOUDFLARE_API_TOKEN} characters; a Cloudflare API token is about 40. It may be the token's name or ID instead of the token."; exit 1; fi
          echo "Token looks right (${#CLOUDFLARE_API_TOKEN} characters)."
          export CLOUDFLARE_API_TOKEN
          if npx --yes wrangler@4.151.2 pages deploy . --project-name tech-tayari --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"; then exit 0; fi
          # Deploy failed: ask Cloudflare what it thinks of the token (prints status only, never the token)
          echo "::group::Token diagnostics"
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "As a user token:    $(api /user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          echo "As an account token: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          echo "Accounts it can see: $(api /accounts | jq -c '[.result[]?.name]')"
          echo "List Pages projects: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects | jq -c '{success, projects: [.result[]?.name], errors: [.errors[]?.message]}')"
          echo "::endgroup::"
          exit 1

      - name: Check the live API
        run: |
          sleep 10
          curl -fsS https://tech-tayari.pages.dev/api/health | tee /dev/stderr | grep -q '"tokenSecretConfigured":true'
