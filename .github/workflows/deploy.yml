# Deploys the site to Cloudflare Pages (project "soma-smart") on every push to main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit permission). See DEPLOY.md.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push replaces a waiting one
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # content.js is generated from content/*.md; fail if someone edited the Markdown but forgot to rebuild
      - name: Check content.js is up to date
        run: |
          python3 _build.py
          git diff --exit-code -- content.js || { echo "::error::content.js is out of date. Run python3 _build.py and commit it."; exit 1; }

      # Deploy only tracked files (never local-only files such as .dev.vars)
      - name: Prepare clean copy of the site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Tokens never contain whitespace, so strip any line break or space that came with the paste.
      # Clear messages for the common setup mistakes; the token itself is never printed.
      - name: Deploy
        working-directory: _site
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing."; exit 1; fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qi 'bearer\|curl'; then echo "::error::CLOUDFLARE_API_TOKEN looks like a command, not a token. Save only the token itself."; exit 1; fi
          if [ ${#CLOUDFLARE_API_TOKEN} -lt 30 ]; then echo "::error::CLOUDFLARE_API_TOKEN is only ${#CLOUDFLARE_API_TOKEN} characters; a Cloudflare API token is about 40. It may be the token's name or ID instead of the token."; exit 1; fi
          echo "Token looks right (${#CLOUDFLARE_API_TOKEN} characters)."
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4.151.2 pages deploy . --project-name soma-smart --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"

      - name: Check the live API
        run: |
          sleep 10
          curl -fsS https://soma-smart.pages.dev/api/health | tee /dev/stderr | grep -q '"tokenSecretConfigured":true'
